[versions]
kotlin = "2.3.20"
ksp = "2.3.9"
agp = "8.13.0"
hilt = "2.57.1"
datastore = "1.2.1"
coroutines = "1.11.0"
junit = "4.13.2"
androidx-test-junit = "1.2.1"
androidx-test-runner = "1.6.2"
androidx-test-core = "1.6.1"
# :backup module — SAF DocumentFile I/O, androidx.startup Initializer, and Robolectric for the
# API 26-29 checkpoint-fallback branch (JVM-testable off-device).
documentfile = "1.1.0"
startup = "1.2.0"
robolectric = "4.14.1"
# :backup Drive networking (D-01/D-01a). OkHttp is the SOLE networking dependency: a single lean
# artifact, minSdk 21, ships consumer ProGuard rules (R8-clean). Pinned to 4.12.0 — the last
# proven-stable single artifact. First-party Square. mockwebserver (same version) drives the JVM
# DriveClient suite with no real network.
okhttp = "4.12.0"
# :backup scheduled backups (SCH-01/02/05). WorkManager is the OS-driven background scheduler that
# wakes BackupWorker. First-party Google AndroidX. work-testing (same version) drives
# TestListenableWorkerBuilder in both the JVM Result-mapping suite and on-device instrumented runs.
work = "2.11.2"

[libraries]
hilt-android       = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler      = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
datastore-prefs    = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# :backup module deps (LIB-01/LIB-02). documentfile: SAF DocumentFile tree-URI I/O.
# startup-runtime: pre-Hilt cold-start Initializer for the restore swap. robolectric: JVM host
# runner so the API 26-29 checkpoint-fallback branch is testable off-device.
documentfile       = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
startup-runtime    = { module = "androidx.startup:startup-runtime", version.ref = "startup" }
robolectric        = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# :backup Drive REST networking (D-01a — sole networking dep). okio arrives transitively from
# okhttp (also first-party Square) — no separate declaration. mockwebserver: JVM test only.
okhttp             = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

# :backup scheduled backups (SCH-01/02/05). First-party Google AndroidX WorkManager — the reusable
# engine owns the worker; the WorkManager scheduling impl lives in the consumer app (D-08).
work-runtime-ktx   = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
work-testing       = { module = "androidx.work:work-testing", version.ref = "work" }

coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit              = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit  = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-core   = { module = "androidx.test:core", version.ref = "androidx-test-core" }

[plugins]
android-library     = { id = "com.android.library", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
